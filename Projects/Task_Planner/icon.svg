<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231a14"/>
      <stop offset="50%" stop-color="#18130f"/>
      <stop offset="100%" stop-color="#0f0c0a"/>
    </linearGradient>

    <!-- Kaizen Ascending Sunrise Gradient -->
    <linearGradient id="kaizenSunrise" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c45d55"/>
      <stop offset="45%" stop-color="#e08d86"/>
      <stop offset="100%" stop-color="#f7b7b2"/>
    </linearGradient>

    <!-- Inner Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#e08d86" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#e08d86" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e08d86" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Accent for Consistency / Mastery -->
    <linearGradient id="goldAscent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9d48b"/>
      <stop offset="100%" stop-color="#e5a458"/>
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="elevate" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e08d86" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base (App Icon) -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#canvasGrad)" stroke="#3a2d24" stroke-width="6"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#coreGlow)"/>

  <!-- ======================================================================
       KAIZEN EMBLEM: The Continuous Improvement Ascent (Loop + Upward Vector)
       ====================================================================== -->
  <g filter="url(#elevate)">
    <!-- Outer Continuous Improvement Enso Arc -->
    <path d="M 256,92 
             C 346,92 420,166 420,256 
             C 420,346 346,420 256,420 
             C 166,420 92,346 92,256 
             C 92,198 123,148 168,120" 
          fill="none" 
          stroke="url(#kaizenSunrise)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-dasharray="1000" 
          stroke-dashoffset="0"/>

    <!-- Inner 'K' Pillar & Upward Momentum Growth Wing -->
    <!-- Vertical Spine (Disciplined Foundation) -->
    <path d="M 195,170 L 195,342" 
          stroke="#fdf8f4" 
          stroke-width="34" 
          stroke-linecap="round"/>

    <!-- Upward Ascending Right Wing (Continuous +1% Improvement Vector) -->
    <path d="M 215,256 L 332,148" 
          stroke="url(#kaizenSunrise)" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Downward Grounded Right Leg -->
    <path d="M 226,242 L 328,342" 
          stroke="url(#kaizenSunrise)" 
          stroke-width="34" 
          stroke-linecap="round"/>

    <!-- The 1% Improvement Zenith Spark (Apex Dot) -->
    <circle cx="366" cy="116" r="20" fill="url(#goldAscent)"/>
  </g>
</svg>
